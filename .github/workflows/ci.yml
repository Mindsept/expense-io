name: ARLA verification

on:
  pull_request:
  push:
    branches: [main, 'codex/arla-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arla-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify pinned runtime
        run: |
          node --version
          npm --version
          test "$(node --version)" = "v24.22.1"
          test "$(npm --version)" = "11.19.1"
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify production build and real API/browser tests
        run: npm run test:ci
      - name: Clean only the owned test stack
        if: always()
        run: npm run test:down -- --if-present
      - name: Retain sanitized evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: arla-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: .test-runtime/reports/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
