# Explicit disposable test target; never use these public credentials elsewhere.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: expense_ha05_test
      POSTGRES_USER: expense_ha05_test
      POSTGRES_PASSWORD: local-disposable-test-only
    ports:
      - '127.0.0.1:55414:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U expense_ha05_test -d expense_ha05_test']
      interval: 1s
      timeout: 2s
      retries: 30
